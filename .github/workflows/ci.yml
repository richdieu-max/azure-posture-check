name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer (only if the runner lacks them)
        shell: pwsh
        run: |
          $havePester   = Get-Module -ListAvailable Pester | Where-Object Version -ge '5.5.0'
          $haveAnalyzer = Get-Module -ListAvailable PSScriptAnalyzer
          if (-not $havePester -or -not $haveAnalyzer) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            if (-not $havePester)   { Install-Module Pester -MinimumVersion 5.5.0 -Force }
            if (-not $haveAnalyzer) { Install-Module PSScriptAnalyzer -Force }
          }
          Get-Module -ListAvailable Pester, PSScriptAnalyzer | Select-Object Name, Version | Format-Table -AutoSize

      - name: Lint
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { throw "$($issues.Count) PSScriptAnalyzer error(s)" }

      - name: Unit tests
        shell: pwsh
        run: |
          $cfg = New-PesterConfiguration
          $cfg.Run.Path = './tests'
          $cfg.Run.Exit = $true
          $cfg.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $cfg
